name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q archive.zip -d extracted

          if [ -d extracted/AetherMC ]; then
            cp -a extracted/AetherMC/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted archive.zip

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract AetherMC project files" || echo "No changes to commit"
          git push
